services:
  # 1. Backend REST API Web Service (Flask + Gunicorn)
  - type: web
    name: edustudent-sight-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true

  # 2. Frontend Static Web App (HTML5 / Vanilla CSS & JS)
  - type: web
    name: edustudent-sight
    runtime: static
    region: oregon
    plan: free
    rootDir: front-end
    buildCommand: ""
    publishDir: "."
    routes:
      - type: rewrite
        source: /api/*
        destination: https://edustudent-sight-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    autoDeploy: true
